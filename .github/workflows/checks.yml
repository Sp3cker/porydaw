name: All checks

on:
  push:
    branches: [fork-main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - run: uv run --no-sync dev tools:check

  checks-macos:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - name: Standalone backup tests
        run: uv run --no-sync dev checks:backups
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true
      # Build with the .swift-version toolchain, as local builds do; Xcode's Debug codegen differs.
      - name: Install pinned Swift toolchain
        run: |
          curl -fsSL https://download.swift.org/swiftly/darwin/swiftly.pkg -o "$RUNNER_TEMP/swiftly.pkg"
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --skip-install --assume-yes --no-modify-profile --quiet-shell-followup
          "$HOME/.swiftly/bin/swiftly" install --use --assume-yes "$(cat .swift-version)"
          "$HOME/.swiftly/bin/swiftc" --version
      - name: Harness tests
        run: uv run --no-sync dev tools:check
      - name: Formatting
        if: ${{ !cancelled() }}
        run: uv run --no-sync dev format --check
      - name: Build checks
        id: build
        if: ${{ !cancelled() }}
        run: uv run --no-sync dev build:checks
      - name: Native checks including opt-in checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync dev checks --all --verbose --pool=1
      - name: Shell QML checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync dev checks:shell --all --verbose --pool=1
      - name: Drawer QML checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync dev checks:qml --all --verbose --pool=1
      - name: Roll QML checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run --no-sync dev checks:qml-roll --all --verbose --pool=1
      - name: Bridge surface
        if: ${{ !cancelled() }}
        run: uv run --no-sync dev checks:bridge
      - name: Retain native build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: all-checks-macos
          path: build/debug/build.log

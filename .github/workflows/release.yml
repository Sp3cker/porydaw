# Cutting a release: Actions → Release → Run workflow, enter any tag
# (e.g. "version 1"). The tag is created if it does not exist, and the
# per-platform builds attach to that release. Nothing runs on tag push.
name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (created if it does not exist)'
        required: true
      name:
        description: 'Release title (defaults to the tag)'
        required: false
        default: ''
      dry_run:
        description: 'Build and launch-test only; upload workflow artifacts, publish nothing'
        type: boolean
        default: false

jobs:
  # Creates the release up front so the per-platform jobs only ever attach
  # files to it (avoids concurrent-creation races).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute safe tag
        # Git tags cannot contain spaces (or ~ ^ : ? * [ \). The release
        # title keeps the raw input; the tag replaces each run of
        # disallowed characters with a single '-'.
        run: |
          safe_tag="$(printf '%s' "${{ inputs.tag }}" | sed 's/[^A-Za-z0-9._\/-]\{1,\}/-/g')"
          if [ -z "$safe_tag" ]; then
            echo "Tag '${{ inputs.tag }}' sanitizes to empty; use [A-Za-z0-9._/-] or spaces." >&2
            exit 1
          fi
          echo "SAFE_TAG=$safe_tag" >> "$GITHUB_ENV"
          echo "Safe tag: $safe_tag (title: ${{ inputs.tag }})"

      - name: Create the release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SAFE_TAG }}
          name: ${{ inputs.name != '' && inputs.name || inputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    # Pinned to the oldest supported runner: AppImages never bundle glibc, so
    # the build machine's glibc is the artifact's compatibility floor. Building
    # on 22.04 (glibc 2.35) keeps the AppImage runnable on 22.04-era distros;
    # ubuntu-latest (24.04, glibc 2.39) produced binaries that fail there.
    runs-on: ubuntu-22.04
    env:
      BUILD_NAME: porydaw-linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPORYDAW_BUILD_CHECKS=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Compute safe tag
        run: |
          echo "SAFE_TAG=$(printf '%s' "${{ inputs.tag }}" | sed 's/[^A-Za-z0-9._\/-]\{1,\}/-/g')" >> "$GITHUB_ENV"

      - name: Package AppImage
        # linuxdeploy bundles Qt and the Swift runtime libraries. The shell QML and
        # bundled fonts load from the executable's directory, so they sit beside it.
        # Wayland ships beside xcb: Qt 6.10+ has one libqwayland.so, and the
        # waylandcompositor module makes the plugin deploy its client plugins.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QML_SOURCES_PATHS: src/ui
          EXTRA_PLATFORM_PLUGINS: libqwayland.so
          EXTRA_QT_MODULES: waylandcompositor
          VERSION: ${{ env.SAFE_TAG }}
        run: |
          mkdir -p AppDir/usr/bin
          cp build/PorydawApplication.qml build/*.ttf build/*.otf AppDir/usr/bin/
          curl -fLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e build/porydaw \
            -d resources/porydaw.desktop \
            -i resources/porydaw.png \
            --plugin qt \
            --output appimage

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Proves the bundle is self-contained: the first QML frame on Xvfb with no Qt paths set.
      - name: Launch packaged porydaw
        run: |
          command -v xvfb-run || sudo apt-get install -y --no-install-recommends xvfb
          deno_bin="$(command -v deno)"
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u LD_LIBRARY_PATH PATH=/usr/bin:/bin \
            xvfb-run -a "$deno_bin" run --allow-read --allow-run tools/startup_bench.ts \
            --runs 1 --timeout-ms 60000 --budget-ms 60000 --binary AppDir/usr/bin/porydaw

      - name: Prep Release Directory
        run: |
          mkdir "$BUILD_NAME"
          mv porydaw-*.AppImage "$BUILD_NAME/porydaw.AppImage"
          cp RELEASE-README.txt "$BUILD_NAME/README.txt"
          zip -r "$BUILD_NAME.zip" "$BUILD_NAME"

      - name: Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SAFE_TAG }}
          files: porydaw-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dry-run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-linux
          path: porydaw-linux.zip

  build-macos:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # Only Xcode 27 ships Swift 6.4, and its image is arm64; x86_64 cross-compiles
        # against Qt's universal frameworks.
        include:
          - os: xcode-27
            arch: arm64
          - os: xcode-27
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      BUILD_NAME: porydaw-macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute safe tag
        run: |
          echo "SAFE_TAG=$(printf '%s' "${{ inputs.tag }}" | sed 's/[^A-Za-z0-9._\/-]\{1,\}/-/g')" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPORYDAW_BUILD_CHECKS=OFF
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build
        run: cmake --build build -j3

      - name: Create Disk Image
        # macdeployqt scans the embedded QML sources so runtime modules such as
        # QtQuick.Controls.Basic and QtQuick.Layouts are included. Deployment
        # changes the linker-provided ad-hoc signature, so -codesign=- signs the
        # completed bundle before the verification step.
        #
        # The dmg is built with hdiutil rather than macdeployqt -dmg so the
        # window that opens on mount also shows "RUN AFTER INSTALL.txt" (the
        # quarantine-removal instructions users must see, deliberately not
        # named README) and an /Applications shortcut for drag-install.
        # hdiutil create is occasionally flaky on CI runners ("resource
        # busy"), hence the retry loop.
        run: |
          macdeployqt build/porydaw.app -qmldir=src/ui -codesign=-
          codesign --verify --deep --strict --verbose=2 build/porydaw.app
          mkdir dmg-root
          cp -R build/porydaw.app dmg-root/
          cp "RUN AFTER INSTALL.txt" dmg-root/
          ln -s /Applications dmg-root/Applications
          created=
          for attempt in 1 2 3; do
            if hdiutil create -volname porydaw -srcfolder dmg-root -ov \
                -format UDZO build/porydaw.dmg; then
              created=1
              break
            fi
            sleep 5
          done
          [ -n "$created" ]

      - name: Prep Release Directory
        run: |
          mkdir "$BUILD_NAME"
          cp build/porydaw.dmg "$BUILD_NAME/porydaw.dmg"
          cp RELEASE-README.txt "$BUILD_NAME/README.txt"
          zip -r "$BUILD_NAME.zip" "$BUILD_NAME"

      - name: Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SAFE_TAG }}
          files: ${{ env.BUILD_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dry-run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: ${{ env.BUILD_NAME }}.zip

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      BUILD_NAME: porydaw-windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute safe tag
        shell: bash
        run: |
          echo "SAFE_TAG=$(printf '%s' "${{ inputs.tag }}" | sed 's/[^A-Za-z0-9._\/-]\{1,\}/-/g')" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          cache: true
          # aqtinstall 3.3 cannot read Qt 6.11's flattened Windows repository layout.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          arch: win64_msvc2022_64

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Patch Qt for Swift's Clang importer
        run: deno run --allow-read --allow-write tools/qt_version_number_patch.ts "$env:QT_ROOT_DIR"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPORYDAW_BUILD_CHECKS=OFF

      - name: Build
        run: cmake --build build

      - name: Prep Release Directory
        shell: pwsh
        run: |
          cmake --install build --prefix "$env:BUILD_NAME"
          Copy-Item RELEASE-README.txt "$env:BUILD_NAME/README.txt"

      # Proves the staged folder is self-contained: the first QML frame with no Qt or Swift on PATH.
      - name: Launch staged porydaw.exe
        shell: pwsh
        run: |
          $deno = (Get-Command deno).Source
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          & $deno run --allow-read --allow-run tools/startup_bench.ts --runs 1 --timeout-ms 60000 --budget-ms 60000 --binary "$env:BUILD_NAME\porydaw.exe"
          if ($LASTEXITCODE -ne 0) { throw "porydaw.exe did not reach its first frame" }

      - name: Zip Release Directory
        shell: pwsh
        run: Compress-Archive -Path "$env:BUILD_NAME" -DestinationPath "$env:BUILD_NAME.zip"

      - name: Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SAFE_TAG }}
          files: porydaw-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dry-run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-windows
          path: porydaw-windows.zip

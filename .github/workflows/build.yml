name: Build

on:
  push:
    branches: [fork-main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install clang-format
        run: pip install 'clang-format==22.*'

      - name: Check formatting
        run: deno task format:check

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sp3cker/porydaw-linux-ci:qt6.9.3-deno2.9.5-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

  build-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build

      - name: Report sccache statistics
        run: sccache --show-stats

      - name: Verify Windows SVG deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path build/Qt6Svg.dll)) { throw "Qt6Svg.dll was not deployed" }
          if (-not (Test-Path build/imageformats/qsvg.dll)) { throw "qsvg.dll was not deployed" }
          if (-not (Test-Path build/iconengines/qsvgicon.dll)) { throw "qsvgicon.dll was not deployed" }

  # The harness sweep on an AddressSanitizer build stages each check's declared
  # fixture files in a private scratch directory. Samplecheck runs without its
  # optional corpus pass.
  asan-checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sp3cker/porydaw-linux-ci:qt6.9.3-deno2.9.5-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start a dummy audio server
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=ci || true
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DPORYDAW_ASAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Run harnesses
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          deno task checks build-asan/porydaw_checks

name: Build

on:
  push:
    branches: [fork-main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      # Full history: changed lines are measured from the previous fork-main push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # swift-format ships with the runner image's Swift toolchain.
      - name: Check formatting
        env:
          BASE: ${{ github.event.before }}
        run: deno task format --check --base "$BASE"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache C/C++ objects
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPORYDAW_BUILD_CHECKS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-linux
          path: build/porydaw
  build-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache C/C++ objects
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true
          # aqtinstall 3.3 cannot read Qt 6.11's flattened Windows repository layout.
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7' || '' }}
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}

      - name: Set up Deno
        if: runner.os == 'Windows'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Patch Qt for Swift's Clang importer
        if: runner.os == 'Windows'
        run: deno run --allow-read --allow-write tools/qt_version_number_patch.ts "$env:QT_ROOT_DIR"

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # windows-latest ships no Swift; ubuntu-latest ships Swift 6.4 and the
      # xcode-27 image ships Xcode 27. The Qt main executor needs >= 6.4 (CMakeLists.txt:166).
      - name: Set up Swift
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE

      # Artifact builds don't run harnesses; the asan-checks job compiles them.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPORYDAW_BUILD_CHECKS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build

      - name: sccache stats
        run: sccache --show-stats || true

      - name: Package macOS Disk Image
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/porydaw.app -codesign=-
          codesign --verify --deep --strict --verbose=2 build/porydaw.app
          mkdir dmg-root
          cp -R build/porydaw.app dmg-root/
          if [ -f "RUN AFTER INSTALL.txt" ]; then cp "RUN AFTER INSTALL.txt" dmg-root/; fi
          ln -s /Applications dmg-root/Applications
          created=
          for attempt in 1 2 3; do
            if hdiutil create -volname porydaw -srcfolder dmg-root -ov \
                -format UDZO build/porydaw.dmg; then
              created=1
              break
            fi
            sleep 5
          done
          [ -n "$created" ]

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-macos
          path: build/porydaw.dmg

      - name: Stage Windows Artifact Directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --prefix porydaw-windows
          if (Test-Path RELEASE-README.txt) { Copy-Item RELEASE-README.txt porydaw-windows/README.txt }

      # Proves the staged folder is self-contained: the first QML frame with no Qt or Swift on PATH.
      - name: Launch staged porydaw.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deno = (Get-Command deno).Source
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          & $deno run --allow-read --allow-run tools/startup_bench.ts --runs 1 --timeout-ms 60000 --budget-ms 60000 --binary porydaw-windows\porydaw.exe
          if ($LASTEXITCODE -ne 0) { throw "porydaw.exe did not reach its first frame" }

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-windows
          path: porydaw-windows

  # AddressSanitizer sweep of the porydaw_checks catalog with the software Qt Quick
  # backend; windowing checks and the QML lanes are not run here.
  asan-checks:
    runs-on: [self-hosted, porydaw-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Start a dummy audio server
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=ci || true
      # LLD avoids GNU ld's >16 GB peak when linking the ASAN check binary.
      - name: Configure
        run: >-
          cmake -S . -B /mnt/ci/build-asan -G Ninja -DPORYDAW_ASAN=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_LINKER_TYPE=LLD
          -DCMAKE_Swift_FLAGS_RELWITHDEBINFO="-O -g -num-threads $(nproc)"

      - name: Build
        run: cmake --build /mnt/ci/build-asan -j"$(nproc)"

      - name: Run harnesses
        run: |
          checks=(deno run --allow-read --allow-write --allow-run
            --allow-env=ASAN_OPTIONS,DISPLAY,PORYDAW_SAMPLE_CORPUS,PORYDAW_CHECK_HOST
            tools/run_checks.ts /mnt/ci/build-asan/porydaw_checks
            --no-windowing-checks)
          set +e
          QT_QUICK_BACKEND=software "${checks[@]}" --filter=projectstore-parity --pool=1
          parity_status=$?
          QT_QUICK_BACKEND=software "${checks[@]}" --exclude=projectstore-parity --pool=4
          remaining_status=$?
          (( parity_status == 0 && remaining_status == 0 ))

      - name: sccache stats
        run: sccache --show-stats || true

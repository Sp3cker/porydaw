name: Build

on:
  push:
    branches: [fork-main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  # Formatting gate: src/ and tools/ must match the repo .clang-format.
  # Pinned to clang-format major 22 — output differs across major
  # versions, so contributors should format with the same major
  # (tools/format.sh warns on a mismatch).
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install 'clang-format==22.*'

      - name: Check formatting
        run: tools/format.sh --check

  # Build once per workflow; dependent jobs pull this exact resulting digest.
  build-linux-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build and publish Linux CI image
        uses: docker/build-push-action@v6
        with:
          context: .github/ci/linux
          push: true
          tags: ghcr.io/sp3cker/porydaw-linux-ci:ci-${{ github.sha }}

      - id: image
        name: Publish image digest
        run: |
          echo "image=ghcr.io/sp3cker/porydaw-linux-ci@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    needs: build-linux-image
    container:
      image: ${{ needs.build-linux-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

  build-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build

      - name: Report sccache statistics
        run: sccache --show-stats

      - name: Verify Windows SVG deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path build/Qt6Svg.dll)) { throw "Qt6Svg.dll was not deployed" }
          if (-not (Test-Path build/imageformats/qsvg.dll)) { throw "qsvg.dll was not deployed" }
          if (-not (Test-Path build/iconengines/qsvgicon.dll)) { throw "qsvgicon.dll was not deployed" }

  # The harness sweep on an AddressSanitizer build stages each check's declared
  # fixture files in a private scratch directory. Samplecheck runs without its
  # optional corpus pass.
  asan-checks:
    runs-on: ubuntu-latest
    needs: build-linux-image
    container:
      image: ${{ needs.build-linux-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start a dummy audio server
        # The engine prefers PulseAudio; a headless daemon with a null sink
        # keeps every audio-dependent harness happy. Best-effort: without
        # it, miniaudio's own null backend is the fallback.
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=ci || true
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DPORYDAW_ASAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Run harnesses
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          deno task checks build-asan/porydaw_checks

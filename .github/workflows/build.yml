name: Build

on:
  push:
    branches: [fork-main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install clang-format
        run: pip install 'clang-format==22.*'

      - name: Check formatting
        run: deno task format:check

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build


      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-linux
          path: build/porydaw
  build-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          cache: true
          # aqtinstall 3.3 cannot read Qt 6.11's flattened Windows repository layout.
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7' || '' }}
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Verify Windows SVG deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path build/Qt6Svg.dll)) { throw "Qt6Svg.dll was not deployed" }
          if (-not (Test-Path build/imageformats/qsvg.dll)) { throw "qsvg.dll was not deployed" }
          if (-not (Test-Path build/iconengines/qsvgicon.dll)) { throw "qsvgicon.dll was not deployed" }

      - name: Package macOS Disk Image
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/porydaw.app -codesign=-
          codesign --verify --deep --strict --verbose=2 build/porydaw.app
          mkdir dmg-root
          cp -R build/porydaw.app dmg-root/
          if [ -f "RUN AFTER INSTALL.txt" ]; then cp "RUN AFTER INSTALL.txt" dmg-root/; fi
          ln -s /Applications dmg-root/Applications
          created=
          for attempt in 1 2 3; do
            if hdiutil create -volname porydaw -srcfolder dmg-root -ov \
                -format UDZO build/porydaw.dmg; then
              created=1
              break
            fi
            sleep 5
          done
          [ -n "$created" ]

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-macos
          path: build/porydaw.dmg

      - name: Prep Windows Artifact Directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path porydaw-windows
          Get-ChildItem -Path build -Exclude "*.obj", "*.ninja*", "CMakeFiles", ".cmake", "*.a", "*.lib", "porydaw_checks*" | Copy-Item -Destination porydaw-windows -Recurse
          if (Test-Path RELEASE-README.txt) { Copy-Item RELEASE-README.txt porydaw-windows/README.txt }

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-windows
          path: porydaw-windows

  # The harness sweep on an AddressSanitizer build stages each check's declared
  # fixture files in a private scratch directory. Qt Quick uses its software
  # backend so offscreen GUI checks do not require a graphics device. Native
  # window paint/timing checks and Qt Quick timeline harnesses stay in the
  # normal verification sweep because sanitizer overhead changes their timing
  # and the CI runner cannot render the timeline scene reliably. Samplecheck
  # runs without its optional corpus pass.
  asan-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install PulseAudio
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          pulseaudio pulseaudio-utils

      - name: Start a dummy audio server
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=ci || true
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DPORYDAW_ASAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Run harnesses
        run: >-
          QT_QUICK_BACKEND=software
          deno run --allow-read --allow-write --allow-run
          --allow-env=ASAN_OPTIONS,DISPLAY,LLVM_PROFILE_FILE,PORYDAW_SAMPLE_CORPUS
          tools/run_checks.ts build-asan/porydaw_checks
          --no-windowing-checks --pool=1
          --exclude=vgsavecheck --exclude=tabcheck --exclude=onboardcheck
          --exclude=sessioncheck --exclude=editor-drawer

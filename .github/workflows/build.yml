name: Build

on:
  push:
    branches: [fork-main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install clang-format
        run: pip install 'clang-format==22.*'

      - name: Check formatting
        run: deno task format:check

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sp3cker/porydaw-linux-ci:qt6.9.3-deno2.9.5-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build


      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-linux
          path: build/porydaw
  build-native:
    strategy:
      fail-fast: false
    matrix:
      os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Verify Windows SVG deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path build/Qt6Svg.dll)) { throw "Qt6Svg.dll was not deployed" }
          if (-not (Test-Path build/imageformats/qsvg.dll)) { throw "qsvg.dll was not deployed" }
          if (-not (Test-Path build/iconengines/qsvgicon.dll)) { throw "qsvgicon.dll was not deployed" }

      - name: Package macOS Disk Image
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/porydaw.app -codesign=-
          codesign --verify --deep --strict --verbose=2 build/porydaw.app
          mkdir dmg-root
          cp -R build/porydaw.app dmg-root/
          if [ -f "RUN AFTER INSTALL.txt" ]; then cp "RUN AFTER INSTALL.txt" dmg-root/; fi
          ln -s /Applications dmg-root/Applications
          created=
          for attempt in 1 2 3; do
            if hdiutil create -volname porydaw -srcfolder dmg-root -ov \
                -format UDZO build/porydaw.dmg; then
              created=1
              break
            fi
            sleep 5
          done
          [ -n "$created" ]

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-macos
          path: build/porydaw.dmg

      - name: Prep Windows Artifact Directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path porydaw-windows
          Get-ChildItem -Path build -Exclude "*.obj", "*.ninja*", "CMakeFiles", ".cmake", "*.a", "*.lib", "porydaw_checks*" | Copy-Item -Destination porydaw-windows -Recurse
          if (Test-Path RELEASE-README.txt) { Copy-Item RELEASE-README.txt porydaw-windows/README.txt }

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: porydaw-windows
          path: porydaw-windows

  # The harness sweep on an AddressSanitizer build stages each check's declared
  # fixture files in a private scratch directory. Samplecheck runs without its
  # optional corpus pass.
  asan-checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sp3cker/porydaw-linux-ci:qt6.9.3-deno2.9.5-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start a dummy audio server
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=ci || true
      - name: Configure
        run: cmake -S . -B build-asan -G Ninja -DPORYDAW_ASAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Run harnesses
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          deno task checks build-asan/porydaw_checks

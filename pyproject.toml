[project]
name = "porydaw-dev"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["ninja==1.13.2"]

[project.scripts]
dev = "porydaw_dev.cli:main"

[dependency-groups]
dev = ["ruff==0.17.0"]
qt = ["aqtinstall"]

[tool.uv.sources]
aqtinstall = { git = "https://github.com/miurahr/aqtinstall.git", rev = "076e1659807d0b362a3ed684d54c2e9c775eb9c7" }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "tools"
module-name = "porydaw_dev"

[tool.ruff]
target-version = "py313"
include = ["tools/porydaw_dev/**/*.py", "tools/tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

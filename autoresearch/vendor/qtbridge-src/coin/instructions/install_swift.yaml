type: Group
instructions:
  - type: ChangeDirectory
    directory: "{{.AgentWorkingDir}}"
    maxTimeInSeconds: 300
    maxTimeBetweenOutput: 120
    userMessageOnFailure: >
      Failed to change to agent working dir.

  - type: ExecuteCommand
    command: "curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg"
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to dowload swiftly.

  - type: ExecuteCommand
    command: "installer -pkg swiftly.pkg -target CurrentUserHomeDirectory"
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to install swiftly.

  - type: ExecuteCommand
    command: "{{.Env.HOME}}/.swiftly/bin/swiftly init --quiet-shell-followup"
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to init swiftly.

  - type: ExecuteCommand
    command: ["sh", "-c", ". {{.Env.HOME}}/.swiftly/env.sh && swiftly install 6.3.1"]
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to install swift 6.3.1.

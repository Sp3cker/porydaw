type: Group
instructions:
  - type: Group
    instructions:
      - !include "{{qt/qtbridge-swift}}/install_swift.yaml"

  - type: ChangeDirectory
    directory: "{{.AgentWorkingDir}}/qt/qtbridge-swift"
    maxTimeInSeconds: 300
    maxTimeBetweenOutput: 120
    userMessageOnFailure: >
      Failed to change to qtbridge-swift dir

  - type: EnvironmentVariable
    variableName: SWIFTLY_ENV
    variableValue: "{{.Env.HOME}}/.swiftly/env.sh"

  - type: ExecuteCommand
    command: ["sh", "-c", ". {{.Env.SWIFTLY_ENV}} && swiftly use 6.3.1 -y"]
    maxTimeInSeconds: 300
    maxTimeBetweenOutput: 120
    userMessageOnFailure: >
      Failed to set swift version to 6.3.1

# This is needed due to swift/bridging not being included in the path by default on non-Xcode toolchains
# Issue can be tracked: https://github.com/swiftlang/swift-package-manager/issues/9010
  - type: EnvironmentVariable
    variableName: SWIFT_BRIDGING
    variableValue: "{{.Env.HOME}}/Library/Developer/Toolchains/swift-6.3.1-RELEASE.xctoolchain/usr/include"

  - type: ExecuteCommand
    command: ["sh", "-c", ". {{.Env.SWIFTLY_ENV}} && swift --version && swift build -Xcc -I{{.Env.SWIFT_BRIDGING}}"]
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to build qtbridge for swift.

  - type: ExecuteCommand
    command: ["sh", "-c", ". {{.Env.SWIFTLY_ENV}} && swift test -Xcc -I{{.Env.SWIFT_BRIDGING}}"]
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to run test.

type: Group
instructions:
  # All this should be moved to qt5 provisioning
  - type: ChangeDirectory
    directory: "{{.AgentWorkingDir}}"
    maxTimeInSeconds: 300
    maxTimeBetweenOutput: 120
    userMessageOnFailure: >
      Failed to change to agent working dir
  - type: ExecuteCommand
    command: "curl -O https://download.swift.org/swift-6.3-release/windows10/swift-6.3-RELEASE/swift-6.3-RELEASE-windows10.exe"
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to dowload swiftly.
  - type: ExecuteCommand
    command: "{{.AgentWorkingDir}}\\swift-6.3-RELEASE-windows10.exe /install /quiet /norestart"
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to install swiftly.
  - type: PrependToEnvironmentVariable
    variableName: PATH
    variableValue: "C:\\Users\\qt\\AppData\\Local\\Programs\\Swift\\Toolchains\\6.3.0+Asserts\\usr\\bin\\;C:\\Users\\qt\\AppData\\Local\\Programs\\Swift\\Runtimes\\6.3.0\\usr\\bin\\;"
  - type: PrependToEnvironmentVariable
    variableName: __VSCMD_PREINIT_PATH
    variableValue: "C:\\Users\\qt\\AppData\\Local\\Programs\\Swift\\Toolchains\\6.3.0+Asserts\\usr\\bin\\;C:\\Users\\qt\\AppData\\Local\\Programs\\Swift\\Runtimes\\6.3.0\\usr\\bin\\;"
  - type: PrependToEnvironmentVariable
    variableName: SDKROOT
    variableValue: "C:\\Users\\qt\\AppData\\Local\\Programs\\Swift\\Platforms\\6.3.0\\Windows.platform\\Developer\\SDKs\\Windows.sdk\\"

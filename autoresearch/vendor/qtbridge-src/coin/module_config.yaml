version: 2
tags: [git]
accept_configuration:
  condition: property
  property: features
  not_contains_value: Disable

instructions:
  Build:
    - type: Group
      instructions:
        # Use CMake build on Linux
        - type: Group
          instructions:
            - !include "{{qt/qtbridge-swift}}/build_cmake.yaml"
          disable_if:
            condition: property
            property: host.os
            equals_value: MacOS
        # Use Swift build on macOS
        - type: Group
          instructions:
            - !include "{{qt/qtbridge-swift}}/build_swift.yaml"
          enable_if:
            condition: property
            property: host.os
            equals_value: MacOS
      enable_if:
        condition: property
        property: features
        contains_value: RunAsPlatformDependency
  Test:
    - !include "{{qt/qtbase}}/run_license_check.yaml"
